# ---- Demo area: Nagpur and Butibori (UPGRADE §2) ----
# Named zones instead of one radius: two full-detail circles joined by a thin corridor along the real
# main road (built by scripts/area.py into data/area.geojson). center/radius_m only enclose the zones
# (projection origin + grid extent); "in the area" means inside a zone.
city_name: "Nagpur and Butibori"
center: {lat: 21.041, lon: 79.0515}
radius_m: 16500
area:
  zones:
    - {id: nagpur, name: "Nagpur core", lat: 21.145, lon: 79.078, radius_m: 4000}          # Sitabuldi, Dharampeth, Sadar, railway station
    - {id: butibori, name: "Butibori and IIIT Nagpur", lat: 20.937, lon: 79.025, radius_m: 3200}   # Butibori town + Waranga (IIIT campus)
  corridor:
    id: corridor
    name: "Wardha Road corridor"
    buffer_m: 500
    highways: "motorway|trunk|primary"                                                  # roads the corridor follows
    major_highways: "motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link"
timezone: "Asia/Kolkata"

seed: 42
data_dir: "../data"          # relative to backend/

overpass_urls:               # tried in order; results are cached, never called during the demo
  - "https://overpass-api.de/api/interpreter"
  - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
  - "https://overpass.kumi.systems/api/interpreter"
user_agent: "NightWay-hackathon/0.1 (CASCADE26 night-time decision engine demo)"

# ---- Simulated clock ----
sim:
  night_date: auto           # YYYY-MM-DD the night starts on, or auto = tonight
  start_time: "02:00"        # where the sim clock starts (local time)
  speed: 10                  # simulated seconds per real second
  start_paused: true         # clock waits at start_time until the first trip is planned
  tick_s: 2.0                # real seconds between live-loop ticks
  warmup_s: 300              # feeds run this many sim seconds before the first plan

# ---- Freshness engine ----
freshness:
  known_min_reliability: 0.7
  outdated_factor: 3         # observed: ttl < age <= 3*ttl -> PROBABLE, beyond -> OUTDATED
  unusable_factor: 10        # observed: age > 10*ttl -> UNKNOWN (too old to use at all)
  coverage_threshold: 0.3    # share of a route that drags a category down to a weaker status
  outdated_discount: 0.5
  decay_scale: 3             # confidence = reliability * exp(-age / (decay_scale * ttl)); 1 = literal exp(-age/ttl)
  kind_caps: {observed: 1.0, scheduled: 0.8, inferred: 0.65, prior: 0.4}

# ---- Data sources (ttl in sim seconds) ----
sources:
  osm_map:          {label: "OpenStreetMap streets & places", kind: observed,  ttl_s: 31536000, reliability: 0.85, synthetic: false, live: false}
  osm_hours:        {label: "OSM opening hours",              kind: observed,  ttl_s: 31536000, reliability: 0.8,  synthetic: false, live: false}
  weather_forecast: {label: "Open-Meteo forecast (cached)",   kind: inferred,  ttl_s: 172800,   reliability: 0.75, synthetic: false, live: false}
  weather_live:     {label: "Weather observations",           kind: observed,  ttl_s: 900,      reliability: 0.8,  synthetic: true,  live: true, dropout: 0.03, max_delay_s: 60}
  traffic_live:     {label: "Live traffic speeds",            kind: observed,  ttl_s: 120,      reliability: 0.85, synthetic: true,  live: true, dropout: 0.05, max_delay_s: 30, coverage: 0.85}
  transit_schedule: {label: "Night bus & metro timetable",    kind: scheduled, ttl_s: 2592000,  reliability: 0.7,  synthetic: true,  live: false}
  transit_realtime: {label: "Bus realtime positions",         kind: observed,  ttl_s: 120,      reliability: 0.9,  synthetic: true,  live: true, dropout: 0.05, max_delay_s: 20, coverage: 0.9}
  closures_feed:    {label: "Road closures & waterlogging",   kind: observed,  ttl_s: 600,      reliability: 0.8,  synthetic: true,  live: true, dropout: 0.03, max_delay_s: 30}
  cab_availability: {label: "Cab / auto availability",        kind: observed,  ttl_s: 300,      reliability: 0.6,  synthetic: true,  live: true, dropout: 0.05, max_delay_s: 30}
  incident_reports: {label: "Live incident reports",          kind: observed,  ttl_s: 600,      reliability: 0.6,  synthetic: true,  live: true, dropout: 0.05, max_delay_s: 60}
  incident_history: {label: "Incident history (90 nights)",   kind: inferred,  ttl_s: 31536000, reliability: 0.6,  synthetic: true,  live: false}

# ---- Risk model ----
risk:
  weights: {lighting: 0.24, incident: 0.24, isolation: 0.2, traffic: 0.1, weather: 0.1, emergency: 0.12}
  grid_m: 250                # incident / heatmap grid
  traffic_cell_m: 500
  cab_zone_m: 1000
  vehicle_factor: 0.35       # risk multiplier for lighting/isolation/incident while inside a cab
  transit_ride_factor: 0.3
  safe_haven_wait_risk: 0.08
  night_hours: [19, 6]       # darkness from 19:00 to 06:00

# ---- Planner ----
planner:
  lambdas: [0, 0.5, 1, 2, 4]
  risk_cost_s_per_m: 0.8     # risk 1.0 on an edge doubles its cost at lambda=1
  walk_speed_mps: {best: 1.45, expected: 1.25, worst: 1.0}
  max_walk_m: 2500
  max_access_walk_m: 1200    # walking to/from a stop
  dedupe_overlap: 0.85
  hysteresis_points: 5
  hysteresis_eta_s: 300
  eta_change_log_s: 180
  stop_buffer_s: 60
  safe_haven_radius_m: 200

# ---- Simple UI (UI_SPEC §4): how worst-case safety maps to Safe / OK / Be careful ----
# UI_SPEC suggests 75 / 50. In this city the worst-case scores of real options sit
# between ~40 (long dark walk) and ~72 (cab), so 75 would never say "Safe".
# Calibrated: cab on main roads -> Safe, night bus -> OK, long unlit walk -> Be careful.
presentation:
  safe_min: 66
  ok_min: 55
  banner_max_age_s: 600       # a plan change older than this is not shown as a banner
  ui_defaults:                # demo convenience: what Home / Work / start / "Be there by" are pre-filled with
    persona: late_shift
    start_at: {lat: 20.94605, lon: 79.04305, name: "IIIT Nagpur (Waranga)"}   # "My location (demo)" when GPS is outside the zones
    deadline: "03:00"

# ---- Night-time behaviour of cabs (prior model, minutes) ----
cab:
  base_wait_min: {"22": 5, "23": 6, "0": 7, "1": 9, "2": 11, "3": 12, "4": 10, "5": 7}
  pickup_walk_m: 60

# ---- Persona presets (Nagpur and Butibori). Points come from scripts/geocode_places.py (Nominatim) ----
# The IIIT Nagpur permanent campus is not named in OpenStreetMap; Waranga village next to it stands in.
personas:
  - id: late_shift
    label: "Late shift in the city"
    origin: "Sitabuldi"
    origin_at: {lat: 21.14254, lon: 79.07961, name: "Sitabuldi"}
    home: "Dharampeth"
    home_at: {lat: 21.14097, lon: 79.06243, name: "Home (Dharampeth)"}
    finish_time: "02:15"
    deadline: "03:00"
    modes: [walk, bus, cab]
    risk_weight: 0.75
    max_walk_m: 1500
  - id: iiit_student
    label: "IIIT Nagpur student"
    origin: "IIIT Nagpur"
    origin_at: {lat: 20.94605, lon: 79.04305, name: "IIIT Nagpur (Waranga)"}
    home: "Sadar"
    home_at: {lat: 21.1592, lon: 79.07961, name: "Home (Sadar)"}
    finish_time: "23:30"
    deadline: "01:00"
    modes: [walk, bus, cab]
    risk_weight: 0.8
    max_walk_m: 1500
  - id: railway_porter
    label: "Railway station porter"
    origin: "Nagpur Railway Station"
    origin_at: {lat: 21.15138, lon: 79.09044, name: "Nagpur Railway Station"}
    home: "Dharampeth"
    home_at: {lat: 21.14097, lon: 79.06243, name: "Home (Dharampeth)"}
    finish_time: "02:30"
    deadline: "03:15"
    modes: [walk, bus]
    risk_weight: 0.6
    max_walk_m: 3000
